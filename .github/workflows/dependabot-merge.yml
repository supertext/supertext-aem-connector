name: Dependabot merge

# Merges Dependabot's minor and patch package updates once every other check
# on the pull request has passed. GitHub Actions updates and majors stay open
# for a person (the built-in token can't merge changes to workflow files).
# See README.md → Dependency updates.
on:
  pull_request:

permissions:
  contents: read

jobs:
  merge:
    name: Merge Dependabot update
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Read the update type
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
      - name: Wait for the other checks, then merge
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: Merge Dependabot update
        run: |
          stable=0
          for _ in $(seq 1 85); do
            sleep 60
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name != \"$SELF\" and .name != \"Dependabot\")]")
            total=$(jq length <<< "$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not))] | length' <<< "$runs")
            if [ "$failed" -gt 0 ]; then
              echo "::notice::A check failed: leaving #$PR for a person."
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              # Two quiet polls in a row, so no check is still being added.
              stable=$((stable + 1))
              if [ "$stable" -ge 2 ]; then
                gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
                exit 0
              fi
            else
              stable=0
            fi
          done
          echo "::notice::Checks still running after 85 minutes: leaving #$PR for a person."
