# Shown when someone clicks "New issue": the support form first, security issues privately.
blank_issues_enabled: true
contact_links:
  - name: Get help or report a problem
    url: https://integrations.supertext.com/en/support?platform=adobe-experience-manager
    about: Questions, problems and ideas about the Supertext plugin. You get an answer by email, in your language; the request is tracked here without your contact details.
  - name: Report a security vulnerability
    url: https://github.com/Supertext/supertext-aem-connector/security/advisories/new
    about: Please report security issues privately, not as a public issue.
